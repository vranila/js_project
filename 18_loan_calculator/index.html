<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Loan Calculator</h2>

    <label>Loan Amount (₹)</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <label>Interest Rate (%)</label>
    <input type="number" id="rate" placeholder="Annual interest">

    <label>Tenure (Years)</label>
    <input type="number" id="years" placeholder="Loan duration">

    <button onclick="calculateEMI()">Calculate</button>

    <div class="result">
      <p>EMI: ₹<span id="emi">0</span></p>
      <p>Total Interest: ₹<span id="interest">0</span></p>
      <p>Total Payment: ₹<span id="total">0</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
